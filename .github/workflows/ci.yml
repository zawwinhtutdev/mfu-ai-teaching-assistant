name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Non-blocking while pre-existing lint debt is cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Public, non-secret placeholders: NEXT_PUBLIC_* are inlined at build
          # time and some pages prerender against the auth client.
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-teaching-assistant:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name ata -p 3000:3000 ai-teaching-assistant:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "container healthy"; exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"; docker logs ata; exit 1
