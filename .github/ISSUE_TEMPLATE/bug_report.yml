name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues first and
        **do not** paste secrets, API keys or real student data.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I open the teacher course page, the roster shows 0 students even though 36 are enrolled.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The roster should list the enrolled students.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the role and route you used.
      placeholder: |
        1. Sign in as anan.suwan@mfu.ac.th
        2. Open /teacherportal/mycourses
        3. Click "Design Concept"
        4. Look at the student list
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Student
        - Teacher
        - Admin
        - Not signed in
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      placeholder: Production (aiassistant-mfu.vercel.app) / local dev / Docker

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Browser console errors, server logs, or screenshots. Remove secrets first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
