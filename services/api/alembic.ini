[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime from app.config (DATABASE_URL).
sqlalchemy.url = postgresql+asyncpg://ata:ata-local-dev@127.0.0.1:5432/ata

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
