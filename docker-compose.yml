# Local + single-host deployment.
#
#   docker compose --env-file .env.local up --build            # web + api
#   docker compose --env-file .env.local --profile platform up # + Postgres/pgvector & Redis
#
# IMPORTANT: pass `--env-file .env.local`. NEXT_PUBLIC_* values are inlined into
# the web bundle at BUILD time, so the build needs the real ones — not just the
# runtime environment.
#
# Platform services are behind a profile so the app can ship before the
# FastAPI/RAG work lands.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ai-teaching-assistant-web:local
    container_name: ata-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Auth + data still served by Supabase in this phase.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # AI (chat stays degraded until a key is present)
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Scheduled jobs are authenticated with this bearer token.
      CRON_SECRET: ${CRON_SECRET:-}
      # Chat proxy -> FastAPI (in-network service name).
      API_SERVICE_URL: ${API_SERVICE_URL:-http://api:8000}
      DEV_PRINCIPAL: ${DEV_PRINCIPAL:-demo.student@mfu.ac.th}
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-false}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: ai-teaching-assistant-api:local
    container_name: ata-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Shares Supabase Auth with the web app; this service only verifies tokens.
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-2.5-flash}
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-false}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Only reachable when the `platform` profile is enabled.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ata:ata-local-dev@db:5432/ata}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    container_name: ata-db
    profiles: ["platform"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ata-local-dev}
      POSTGRES_DB: ata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ata -d ata"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ata-redis
    profiles: ["platform"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
